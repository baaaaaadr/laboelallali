<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body lang="{{lang}}" class="{{modeclass}}">
  <div class="canvas">
    <div class="bg">{{bgimg}}<div class="veil"></div><div class="deco"></div></div>
    <main class="content">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 class="title">{{title}}</h1>
      <ul class="lines">{{lineshtml}}</ul>
    </main>
    <footer class="brandbar">
      <img src="../assets/logos/logo-footer.png" alt="">
      <div class="who">
        <span class="name">{{brandname}}</span>
        <span class="contact">{{contact}}</span>
      </div>
    </footer>
  </div>
  <script src="_fit.js"></script>
</body>
</html>
