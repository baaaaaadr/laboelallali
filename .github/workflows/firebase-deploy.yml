name: Deploy to Firebase Hosting

# ⚠ PLUS DE DÉPLOIEMENT AUTOMATIQUE (décision du propriétaire, 09/09/2026).
#
# Ce workflow se déclenchait sur chaque `push` vers `main`. Le site avait donc
# DEUX chemins de mise en ligne vers la même cible : celui-ci, et la commande
# manuelle `npm run deploy:hosting` (la commande canonique, cf. CLAUDE.md).
# Les deux se marchaient dessus.
#
# Symptôme : un déploiement sur deux échouait, toujours de la même façon —
# `Unexpected non-whitespace character after JSON` dans
# FirebaseExtended/action-hosting-deploy. Les runs en échec duraient ~3 min
# contre 5 à 24 min pour les réussites : firebase-tools s'arrêtait en cours de
# route et l'action n'avait plus de JSON à lire. Mesuré sur les 20 derniers
# runs : 11 réussites, 9 échecs. Le 09/09 à 13h49 UTC, le run a tourné pendant
# qu'un déploiement manuel était en vol.
#
# ⚠ Le vrai risque n'était pas les e-mails d'échec, mais les RÉUSSITES : le
# build d'ici ne reçoit que les 7 secrets `NEXT_PUBLIC_FIREBASE_*`. Il lui
# manque `NEXT_PUBLIC_GOOGLE_CLIENT_ID`. Une réussite pouvait donc écraser un
# bon déploiement par un moins bon.
#
# Le déclenchement manuel est CONSERVÉ : si le poste du propriétaire n'est pas
# disponible, ce workflow reste un filet de secours (onglet Actions → ce
# workflow → « Run workflow »).
on:
  workflow_dispatch:

# Deux exécutions de ce workflow ne peuvent plus se chevaucher. Ne protège pas
# d'une collision avec un déploiement lancé depuis un poste — d'où la règle
# ci-dessus : un seul chemin à la fois.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
